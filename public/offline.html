<!doctype html>
<html lang="id">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#047857">
    <title>Offline — Warung POS</title>
    <style>
      * { box-sizing: border-box; }
      body { min-height: 100vh; margin: 0; display: grid; place-items: center; padding: 24px; background: #f7f8fa; color: #17211c; font: 16px/1.6 Arial, Helvetica, sans-serif; }
      main { width: min(100%, 440px); padding: 32px; border: 1px solid #e2e8f0; border-radius: 20px; background: white; text-align: center; box-shadow: 0 12px 32px #0f172a0d; }
      img { width: 72px; height: 72px; }
      h1 { margin: 18px 0 8px; font-size: 1.4rem; }
      p { margin: 0; color: #64748b; }
      button { margin-top: 24px; border: 0; border-radius: 10px; padding: 11px 18px; background: #047857; color: white; font: inherit; font-weight: 600; cursor: pointer; }
    </style>
  </head>
  <body>
    <main>
      <img src="/icons/icon-192.png" alt="">
      <h1>Anda sedang offline</h1>
      <p>Warung POS memerlukan koneksi internet untuk memuat data dan memproses transaksi. Sambungkan kembali lalu coba lagi.</p>
      <button type="button" onclick="location.reload()">Coba lagi</button>
    </main>
  </body>
</html>
